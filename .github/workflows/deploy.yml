name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/dpti-akrus/portal-pedidos

jobs:
  # =========================================================
  # BUILD + PUBLICAÇÃO NO GHCR
  # =========================================================
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # =====================================================
      # FRONTEND
      # =====================================================
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # =====================================================
      # BACKEND
      # =====================================================
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      # =====================================================
      # DOCKER
      # =====================================================
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # =========================================================
  # DEPLOY NA VPS
  # =========================================================
  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest
    needs:
      - build-and-publish

    steps:
      # =====================================================
      # SSH
      # =====================================================
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/portal_deploy_key
          chmod 600 ~/.ssh/portal_deploy_key

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # =====================================================
      # DEPLOY
      # =====================================================
      - name: Deploy Portal
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -T \
            -i ~/.ssh/portal_deploy_key \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'bash -se' <<'REMOTE_SCRIPT'

          cd /opt/apps/portal-pedidos

          echo "=== Baixando nova imagem ==="
          docker compose pull portal

          echo "=== Atualizando Portal ==="
          docker compose up -d portal

          echo "=== Aguardando healthcheck ==="

          CONTAINER_ID="$(docker compose ps -q portal)"

          if [ -z "$CONTAINER_ID" ]; then
            echo "ERRO: Container do Portal não foi encontrado."
            exit 1
          fi

          DEPLOY_OK=false

          for i in $(seq 1 30); do
            STATUS="$(docker inspect \
              --format='{{.State.Health.Status}}' \
              "$CONTAINER_ID")"

            echo "Tentativa $i/30 - Status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              DEPLOY_OK=true
              break
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo "=== ERRO: Portal ficou unhealthy ==="
              docker compose logs --tail=100 portal
              exit 1
            fi

            sleep 2
          done

          if [ "$DEPLOY_OK" != "true" ]; then
            echo "=== ERRO: Timeout aguardando healthcheck ==="
            docker compose logs --tail=100 portal
            exit 1
          fi

          echo "=== Deploy concluído com sucesso ==="
          docker compose ps portal

          exit 0

          REMOTE_SCRIPT